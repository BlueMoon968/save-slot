name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_TGDB: ${{ secrets.VITE_SUPABASE_TGDB }}
          VITE_SUPABASE_BARCODE: ${{ secrets.VITE_SUPABASE_BARCODE }}
          VITE_ANILIST_CLIENT_ID: ${{ secrets.VITE_ANILIST_CLIENT_ID }}
          VITE_ANILIST_REDIRECT_URI: ${{ secrets.VITE_ANILIST_REDIRECT_URI }}
          VITE_SUPABASE_ANILIST: ${{ secrets.VITE_SUPABASE_ANILIST }}
          VITE_SUPABASE_IGDB: ${{ secrets.VITE_SUPABASE_IGDB }}

      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4